name: Construir APK

on:
workflow_dispatch:
push:
paths:
- 'ScreenOCR-source-v2-android11-timestamp.zip'
- '.github/workflows/build-apk.yml'

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Descargar repositorio
    uses: actions/checkout@v4

  - name: Extraer proyecto
    run: |
      rm -rf project
      mkdir project
      unzip -q ScreenOCR-source-v2-android11-timestamp.zip -d project

  - name: Corregir OcrService
    working-directory: project
    run: |
      echo "Corrigiendo OcrService.kt..."

      sed -i '134,144d' app/src/main/java/com/example/screenocr/OcrService.kt

      sed -i 's/; addDrag(box,b)//' app/src/main/java/com/example/screenocr/OcrService.kt

      echo "OcrService.kt corregido."

  - name: Forzar compatibilidad Android 11
    working-directory: project
    run: |
      python3 - <<'PY'
      from pathlib import Path
      import re

      p = Path("app/build.gradle")
      text = p.read_text()

      print("Configuración original:")
      print(text)

      # Asegurar minSdk 30 (Android 11)
      if re.search(r'\bminSdk(?:Version)?\s+\d+', text):
          text = re.sub(
              r'\bminSdk(?:Version)?\s+\d+',
              'minSdk 30',
              text,
              count=1
          )
      else:
          text = text.replace(
              'defaultConfig {',
              'defaultConfig {\n        minSdk 30',
              1
          )

      # Desactivar splits de ABI para producir un APK universal.
      if 'splits {' not in text:
          text += '''

      android {
          splits {
              abi {
                  enable false
              }
          }
      }
      '''

      p.write_text(text)

      print("================================")
      print("Configuración Android 11 aplicada")
      print("================================")
      print(text)
      PY

  - name: Configurar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Configurar Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.11.1'

  - name: Compilar APK
    working-directory: project
    run: |
      gradle :app:assembleDebug --stacktrace

  - name: Verificar APK
    working-directory: project
    run: |
      APK="app/build/outputs/apk/debug/app-debug.apk"

      echo "===== INFORMACIÓN DEL APK ====="
      ls -lh "$APK"

      echo "===== ZIP TEST ====="
      unzip -t "$APK" > /dev/null
      echo "APK ZIP: OK"

      echo "===== AAPT ====="
      "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20

      echo "===== APKSIGNER ====="
      "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      echo "===== APK VALIDADO CORRECTAMENTE ====="

  - name: Publicar APK
    uses: actions/upload-artifact@v4
    with:
      name: ScreenOCR-APK-Android11
      path: project/app/build/outputs/apk/debug/app-debug.apk
