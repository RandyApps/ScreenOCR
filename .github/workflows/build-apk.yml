name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f TextDetectorApp.zip ]; then
            unzip -o TextDetectorApp.zip
            ls -la TextDetectorApp
          else
            ls -la
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build APK
        working-directory: ${{ github.workspace }}/TextDetectorApp
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TextDetector-APK
          path: TextDetectorApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
