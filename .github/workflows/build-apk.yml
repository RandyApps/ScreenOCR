name: Construir APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ScreenOCR-source-v2-android11-timestamp.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer proyecto
        run: |
          rm -rf project
          mkdir project
          unzip -q ScreenOCR-source-v2-android11-timestamp.zip -d project

      - name: Mostrar OcrService
        working-directory: project
        run: |
          echo "=== OcrService.kt líneas 120-150 ==="
          nl -ba app/src/main/java/com/example/screenocr/OcrService.kt | sed -n '120,150p'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenOCR-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
