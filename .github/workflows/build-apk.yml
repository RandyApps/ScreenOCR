name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare and build
        run: |
          set -eux

          if [ -f TriviaHelper.zip ]; then
            unzip -o TriviaHelper.zip
          fi

          if [ -f TriviaHelper/gradlew ]; then
            cd TriviaHelper
          elif [ -f gradlew ]; then
            true
          else
            FOUND=$(find . -name gradlew -type f | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "ERROR: no se encontro gradlew"
              find . -maxdepth 4 -type f | head -80
              exit 1
            fi
            cd "$(dirname "$FOUND")"
          fi
          echo "PWD=$(pwd)"
          ls -la

          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -d /usr/local/lib/android/sdk ]; then
              export ANDROID_HOME=/usr/local/lib/android/sdk
            elif [ -d "$HOME/Android/Sdk" ]; then
              export ANDROID_HOME="$HOME/Android/Sdk"
            else
              echo "ERROR: no hay ANDROID_HOME"
              exit 1
            fi
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

          chmod +x gradlew
          sed -i '1s|^#!.*|#!/usr/bin/env bash|' gradlew || true
          ./gradlew assembleDebug --stacktrace --no-daemon

          SRC=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK=$SRC"
          test -n "$SRC"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$SRC" "$GITHUB_WORKSPACE/dist/Trivia Helper.apk"
          ls -la "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: TriviaHelper-APK
          path: dist/Trivia Helper.apk
          if-no-files-found: error
