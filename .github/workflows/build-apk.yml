name: Construir APK

on: [workflow_dispatch]

jobs:
build:
runs-on: ubuntu-latest

steps:

  - name: Descargar repositorio
    uses: actions/checkout@v4

  - name: Extraer proyecto
    run: |
      rm -rf project
      mkdir project
      unzip -q ScreenOCR-source-v2-android11-timestamp.zip -d project

  - name: Corregir OcrService
    working-directory: project
    run: |
      echo "Corrigiendo OcrService.kt..."
      sed -i '134,144d' app/src/main/java/com/example/screenocr/OcrService.kt
      sed -i 's/; addDrag(box,b)//' app/src/main/java/com/example/screenocr/OcrService.kt

  - name: Diagnosticar proyecto
    working-directory: project
    run: |
      echo "===== ESTRUCTURA ====="
      find . -maxdepth 4 -type f | sort | head -300

      echo "===== GRADLE ====="
      find . -type f -name "build.gradle" -o -name "build.gradle.kts" -print

      echo "===== SETTINGS ====="
      find . -type f -name "settings.gradle" -o -name "settings.gradle.kts" -print

  - name: Configurar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Configurar Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.11.1'

  - name: Compilar APK
    working-directory: project
    run: gradle :app:assembleDebug --stacktrace

  - name: Verificar APK
    working-directory: project
    run: |
      APK="app/build/outputs/apk/debug/app-debug.apk"
      ls -lh "$APK"
      unzip -t "$APK" > /dev/null
      echo "APK válido."

  - name: Publicar APK
    uses: actions/upload-artifact@v4
    with:
      name: ScreenOCR-APK-Android11
      path: project/app/build/outputs/apk/debug/app-debug.apk
