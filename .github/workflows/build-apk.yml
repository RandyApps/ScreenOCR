name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f TriviaHelper.zip ]; then
            unzip -o TriviaHelper.zip
            ls -la TriviaHelper
          else
            ls -la
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build APK
        working-directory: ${{ github.workspace }}/TriviaHelper
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          SRC=$(find TriviaHelper/app/build/outputs/apk -name "*.apk" | head -n 1)
          mkdir -p dist
          cp "$SRC" "dist/Trivia Helper.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TriviaHelper-APK
          path: dist/Trivia Helper.apk
          if-no-files-found: warn
