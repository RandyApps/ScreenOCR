name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o TextDetectorApp.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Fix missing function updateLastDetection
        working-directory: TextDetectorApp
        run: |
          FILE="app/src/main/java/com/textdetector/app/DetectionAccessibilityService.kt"
          echo "Arreglando $FILE..."
          # Si no existe la funcion, la creamos
          if ! grep -q "fun updateLastDetection" "$FILE"; then
            # Inserta una funcion dummy antes del ultimo }
            # Primero comentamos la llamada que falla con argumentos
            sed -i 's/updateLastDetection(.*)/\/\/ Fixed: &/' "$FILE"
            # Agregamos una funcion vacia al final de la clase para que no falle
            # Buscamos el final de la clase y metemos la funcion
            echo '
              private fun updateLastDetection() {}
              private fun updateLastDetection(text: String) {}
              private fun updateLastDetection(text: String, time: Long) {}
            ' >> "$FILE"
            echo "Parche aplicado"
          fi
          cat "$FILE" | grep -n "updateLastDetection" -A 2 -B 2

      - name: Grant execute permission for gradlew
        working-directory: TextDetectorApp
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: TextDetectorApp
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TextDetector-APK
          path: TextDetectorApp/app/build/outputs/apk/debug/app-debug.apk
