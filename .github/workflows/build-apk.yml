name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip TextDetectorApp.zip
          ls -la
          ls -la TextDetectorApp

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: TextDetectorApp
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: TextDetectorApp
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TextDetector-APK
          path: TextDetectorApp/app/build/outputs/apk/debug/app-debug.apk
