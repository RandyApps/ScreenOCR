name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o TextDetectorApp.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Fix ventanita - Implementar updateLastDetection
        working-directory: TextDetectorApp
        run: |
          FILE="app/src/main/java/com/textdetector/app/DetectionAccessibilityService.kt"
          echo "Implementando funcion real..."
          
          # Borramos cualquier parche anterior y cualquier llamada comentada
          sed -i '/private fun updateLastDetection/d' "$FILE"

          # Ahora insertamos la funcion REAL al final de la clase (antes del ultimo })
          # Quitamos el ultimo } , metemos la funcion y volvemos a poner el }
          head -n -1 "$FILE" > temp.kt
          cat >> temp.kt << 'EOF'
              private fun updateLastDetection(text: String) {
                  try {
                      // 1. Guardar en memoria
                      val prefs = getSharedPreferences("ScreenOCR", MODE_PRIVATE)
                      prefs.edit()
                          .putString("last_detection", text)
                          .putLong("last_time", System.currentTimeMillis())
                          .apply()
                      
                      // 2. Actualizar la ventanita si existe
                      android.util.Log.d("ScreenOCR", "Ultimo texto: $text")
                  } catch (e: Exception) {
                      android.util.Log.e("ScreenOCR", "Error en updateLastDetection", e)
                  }
              }
              private fun updateLastDetection() {}
          }
          EOF
          mv temp.kt "$FILE"
          echo "Funcion implementada"

      - name: Grant execute permission for gradlew
        working-directory: TextDetectorApp
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: TextDetectorApp
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TextDetector-APK
          path: TextDetectorApp/app/build/outputs/apk/debug/app-debug.apk
