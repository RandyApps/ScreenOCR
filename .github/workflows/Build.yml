name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare and build
        run: |
          set -eux
          if [ -f Trivias.zip ]; then
            unzip -o Trivias.zip
          fi
          if [ -f Trivias/gradlew ]; then
            cd Trivias
          elif [ -f gradlew ]; then
            true
          else
            FOUND=$(find . -name gradlew -type f | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "ERROR: no se encontró gradlew"
              exit 1
            fi
            cd "$(dirname "$FOUND")"
          fi
          echo "PWD=$(pwd)"
          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -d /usr/local/lib/android/sdk ]; then
              export ANDROID_HOME=/usr/local/lib/android/sdk
            elif [ -d "$HOME/Android/Sdk" ]; then
              export ANDROID_HOME="$HOME/Android/Sdk"
            else
              echo "ERROR: no hay ANDROID_HOME"
              exit 1
            fi
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ ! -f keystore/trivia-helper.jks ]; then
            echo "WARN: keystore missing"
          fi
          chmod +x gradlew
          sed -i '1s|^#!.*|#!/usr/bin/env bash|' gradlew || true
          ./gradlew assembleDebug --stacktrace --no-daemon
          SRC=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK=$SRC"
          test -n "$SRC"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$SRC" "$GITHUB_WORKSPACE/dist/Trivias.apk"
          ls -la "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: Trivias-APK
          path: dist/Trivias.apk
          if-no-files-found: error