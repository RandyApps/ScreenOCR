name: Build Trivias
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Unzip project
        run: |
          unzip -o Trivias.zip -d .
          ls -la
          ls -la Trivias/
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build APK
        run: |
          cd Trivias
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Trivias-APK
          path: Trivias/app/build/outputs/apk/debug/app-debug.apk
