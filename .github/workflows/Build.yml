name: Build Trivias
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Unzip project
        run: |
          rm -rf app build.gradle settings.gradle
          unzip -o Trivias.zip -d .
          ls -la
          ls -la app/
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build APK
        run: |
          ROOT=$(find . -maxdepth 3 -name "settings.gradle" | head -n 1 | xargs dirname)
          echo "Proyecto en: $ROOT"
          cd $ROOT && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Trivias-APK
          path: "**/app-debug.apk"
