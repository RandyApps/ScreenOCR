name: Build Trivias
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: rm -rf TriviaHelper app
      - run: unzip -o Trivias.zip -d .
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Trivias-APK
          path: app/build/outputs/apk/debug/Trivias.apk
