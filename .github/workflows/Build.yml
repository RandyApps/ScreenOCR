name: Build from ZIP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: unzip -o Trivias.zip -d .
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: chmod +x ./gradlew || chmod +x ./Trivias/gradlew
      - run: cd Trivias && ./gradlew assembleDebug || cd . && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v3
        with:
          name: Trivias-APK
          path: "**/app-debug.apk"
